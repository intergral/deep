name: Build & Test

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: 1.23.x

      - name: Check out code
        uses: actions/checkout@v4

      - name: Setup go-junit-report
        run: go install github.com/jstemmer/go-junit-report/v2@latest

      - name: Test
        run: make test-with-cover-report

      - name: Test Report
        # Pinned to main after v3.0.0: includes dorny/test-reporter#867, which
        # retries the transient 404 on the check-run update (#866) that left
        # "GO Tests" stuck in progress. Move to the first release with it.
        uses: dorny/test-reporter@79b4b4400dc2354b89e9dd811ef9caa9bdd4f665
        if: success() || failure()
        continue-on-error: true
        with:
          name: GO Tests
          # v2+ defaults to the job summary; keep the "GO Tests" check run.
          use-actions-summary: 'false'
          path: report.xml
          reporter: java-junit

      - name: Test Summary
        uses: test-summary/action@v2
        with:
          paths: |
            report.xml
        if: success() || failure()
        continue-on-error: true

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: 1.23.x

      - name: Check out code
        uses: actions/checkout@v4

      - name: Vendor
        run: go mod vendor

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v5
        with:
          distribution: goreleaser
          version: latest
          args: build --clean --snapshot

  vendor-check:
    name: Vendor check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: 1.23.x

      - name: Check out code
        uses: actions/checkout@v4

      - name: Check vendor
        run: make vendor-check

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: 1.23.x

      - name: Check out code
        uses: actions/checkout@v4

      - run: go install mvdan.cc/gofumpt@latest
      - run: go install golang.org/x/tools/cmd/goimports@latest

      - run: make check-fmt
